<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APS Permit Desk — Social Acquisition Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A1F30;--ink2:#0B3A47;--ink3:#036276;
  --bg:#081319;--bg2:#0B1A21;--panel:#0E1F27;--card:#12262F;
  --emerald:#1CC06A;--cyan:#3ECFEF;--blue:#3898EF;--amber:#E8A33D;--rust:#D2544A;--violet:#8B6FD6;
  --paper:#F2F5F7;--rule:rgba(255,255,255,.10);
  --disp:'Sora',system-ui,sans-serif;--body:'Source Sans 3',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --rowpad:7px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--body);color:#fff;font-size:15px;line-height:1.5;
  background:var(--bg);min-height:100vh}
.wrap{max-width:1760px;margin:0 auto;padding:18px 16px 40px}

/* ---- masthead ---- */
header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;
  padding-bottom:11px;border-bottom:1px solid var(--rule)}
::placeholder{color:rgba(255,255,255,.55)!important}
h1{font-family:var(--disp);font-weight:700;font-size:17px;margin:0;letter-spacing:-.01em;line-height:1.2}
h1 small{display:block;font-family:var(--mono);font-size:9.5px;font-weight:400;letter-spacing:.15em;
  text-transform:uppercase;color:var(--cyan);margin-bottom:4px}
.hdr-right{display:flex;gap:12px;align-items:center}
.pace{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:#fff;text-align:right;line-height:1.5}
.pace b{color:var(--cyan);font-weight:500}
.pace .over{color:var(--emerald);font-weight:600}
.pace .under{color:var(--amber);font-weight:600}

#kpis{margin-top:14px}
body.kpi-off #kpis{display:none}
.kpirow{display:grid;gap:8px;margin-bottom:8px}
#kpiPlat{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.vertrow{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.card{background:var(--card);border:1px solid rgba(255,255,255,.12);border-radius:3px;padding:11px 13px}
.card .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:#fff;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:6px}
.card .lab .nm{display:flex;align-items:center;gap:7px;min-width:0}
.card .lab .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vicon{flex:none;width:19px;height:19px;display:block}
.vicon svg{width:100%;height:100%;display:block;fill:none;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card.mini .vicon{width:21px;height:21px}
.card .lab em{font-style:normal;color:rgba(255,255,255,.8)}
.card .fig{font-family:var(--disp);font-weight:600;font-size:30px;letter-spacing:-.02em;color:#fff;
  line-height:1.05;margin:7px 0 2px;display:flex;align-items:baseline;gap:7px}
.card .fig s{text-decoration:none;font-family:var(--mono);font-size:14px;font-weight:400;color:#fff;opacity:.85}
.card .track{height:5px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:8px}
.card .fill{display:block;height:100%;border-radius:3px;width:0;transition:width .45s ease}
.card .pct{font-family:var(--mono);font-size:11.5px;color:#fff;opacity:.92;margin-top:6px;
  display:flex;justify-content:space-between;gap:8px}
.f-fb{background:var(--blue)} .f-ig{background:var(--violet)} .f-li{background:var(--emerald)}
.f-v{background:linear-gradient(90deg,var(--cyan),var(--emerald))}
.card.hit .fill{background:var(--emerald)}
.card.mini{padding:10px 12px}
.card.mini .fig{font-size:23px;margin:5px 0 1px}
.card.mini .lab{font-size:9.5px;letter-spacing:.09em}
.card.mini .track{height:5px;margin-top:7px}
.card.mini .pct{font-size:10.5px;margin-top:5px}

/* hit rates tab */
.rates{background:var(--paper);color:var(--ink);border-radius:3px;padding:22px 26px}
.rates h2{font-family:var(--disp);font-size:19px;margin:0 0 4px;letter-spacing:-.01em}
.rates p.intro{font-size:14px;color:rgba(10,31,48,.8);margin:0 0 18px;max-width:820px}
.rates table{width:100%;font-size:13.5px}
.rates thead th{background:#0C2029;position:static;font-size:9.5px;padding:9px 10px}
.rates td{padding:9px 10px;border-bottom:1px solid rgba(10,31,48,.09);vertical-align:middle}
.rates td.c{text-align:center;font-family:var(--mono)}
.rates .thin{font-family:var(--mono);font-size:11px;color:rgba(10,31,48,.5)}
.rates .up{color:#0C6A39;font-weight:700}
.rates .down{color:#B23B33;font-weight:700}
.rates .flat{color:rgba(10,31,48,.5)}
.rates tfoot td{background:rgba(10,31,48,.06);font-weight:700;border-top:2px solid rgba(10,31,48,.2)}
.rates{display:grid;gap:10px;background:none;padding:0}
.rtable{width:100%;font-size:13px}
.rtable th{background:rgba(10,31,48,.07);color:var(--ink);position:static;font-family:var(--mono);
  font-size:9px;letter-spacing:.09em;text-transform:uppercase;padding:8px 9px;text-align:left}
.rtable th.c{text-align:center}
.rtable td{padding:8px 9px;border-bottom:1px solid rgba(10,31,48,.09);vertical-align:middle}
.rtable td.c{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12.5px}
.rtable tfoot td{background:rgba(10,31,48,.06);font-weight:700;border-top:2px solid rgba(10,31,48,.2)}
.pin{width:52px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:4px 5px;border-radius:2px;
  border:1px solid rgba(10,31,48,.25);background:#FFF9E8;color:var(--ink);text-align:center}
.pin.wide{width:62px}
.tagok{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;
  background:rgba(28,192,106,.2);color:#0C6A39;padding:2px 5px;border-radius:2px}
.tagsoft{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;
  background:rgba(232,163,61,.22);color:#8C5B0D;padding:2px 5px;border-radius:2px}
.rates .callout{background:rgba(232,163,61,.13);border-left:2px solid var(--amber);padding:11px 14px;
  margin:18px 0 0;border-radius:0 3px 3px 0;font-size:13.5px;max-width:860px}

/* trends */
.trend{display:grid;gap:10px}
.trhead{background:linear-gradient(120deg,var(--panel),#0C2B33);border:1px solid rgba(255,255,255,.12);
  border-radius:3px;padding:16px 20px}
.trhead h2{font-family:var(--disp);font-size:19px;margin:0 0 10px;letter-spacing:-.01em;color:#fff}
.trrow{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.trrow label{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--cyan);display:inline-flex;align-items:center;gap:6px}
.trrow input[type=date]{font-family:var(--mono);font-size:12.5px;padding:6px 8px;border-radius:3px;
  border:1px solid rgba(255,255,255,.2);background:var(--card);color:#fff}
.metsel{display:flex;flex-wrap:wrap;gap:5px}
.msw{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding:5px 9px;
  border-radius:3px;border:1px solid rgba(255,255,255,.2);background:var(--card);color:#fff;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px}
.msw i{width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.35}
.msw.on i{opacity:1}
.msw.on{border-color:currentColor}
.chartbox{background:var(--paper);border-radius:3px;padding:16px 18px 10px}
.chartbox svg{width:100%;height:320px;display:block;overflow:visible}
.gl{stroke:rgba(10,31,48,.10);stroke-width:1}
.axt{font-family:'IBM Plex Mono',monospace;font-size:10px;fill:rgba(10,31,48,.6)}
.ln{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.pt{stroke:#fff;stroke-width:1.5}
.cmp{fill:none;stroke-width:1.6;stroke-dasharray:4 4;opacity:.55}
.nodata{padding:60px;text-align:center;color:rgba(10,31,48,.55);font-size:14px}
.nodata b{color:var(--ink)}
.trtable{width:100%;font-size:12.5px}
.trtable th{background:rgba(10,31,48,.07);color:var(--ink);position:static;font-family:var(--mono);
  font-size:9px;letter-spacing:.09em;text-transform:uppercase;padding:8px 9px;text-align:right}
.trtable th:first-child{text-align:left}
.trtable td{padding:8px 9px;border-bottom:1px solid rgba(10,31,48,.08);text-align:right;
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:rgba(10,31,48,.88)}
.trtable td:first-child{text-align:left;font-family:'Source Sans 3',sans-serif;font-weight:700;color:#08192A}
.trtable tfoot td{background:rgba(10,31,48,.06);font-weight:700;border-top:2px solid rgba(10,31,48,.2)}
.dlt{font-size:10.5px;display:block}
.dlt.up{color:#0C6A39}.dlt.dn{color:#B23B33}.dlt.fl{color:rgba(10,31,48,.45)}

/* prospecting */
.prosp{display:grid;gap:10px}
.prhead{background:linear-gradient(120deg,var(--panel),#0C2B33);border:1px solid rgba(255,255,255,.12);
  border-radius:3px;padding:18px 20px;color:#fff}
.prhead h2{font-family:var(--disp);font-size:19px;margin:0 0 5px;letter-spacing:-.01em}
.prhead p{margin:0 0 12px;font-size:13.5px;color:rgba(255,255,255,.88);max-width:860px}
.pastebox{width:100%;min-height:150px;font-family:var(--mono);font-size:12px;line-height:1.45;
  padding:10px 12px;border-radius:3px;border:1px solid rgba(255,255,255,.2);
  background:var(--card);color:#fff;resize:vertical}
.pastebox::placeholder{color:rgba(255,255,255,.4)}
.funnel{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:12px 0}
.fstep{background:var(--card);border:1px solid rgba(255,255,255,.14);border-radius:3px;padding:11px 13px}
.fstep .fl2{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--cyan)}
.fstep .fv{font-family:var(--disp);font-size:26px;font-weight:600;color:#fff;line-height:1.1;margin-top:5px}
.fstep .fn2{font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.75);margin-top:3px}
.fstep.paid{border-color:rgba(232,163,61,.5)}
.fstep.paid .fl2{color:#F3CE93}
.prtable{width:100%;font-size:12.5px}
.prtable th{background:rgba(10,31,48,.07);color:var(--ink);position:static;font-family:var(--mono);
  font-size:9px;letter-spacing:.09em;text-transform:uppercase;padding:8px 9px;text-align:left}
.prtable td{padding:7px 9px;border-bottom:1px solid rgba(10,31,48,.08);vertical-align:top}
.prtable td.c{text-align:center;font-family:var(--mono);font-size:11.5px}
.prname{font-weight:700;color:#08192A}
.prhandle{font-family:var(--mono);font-size:11px;color:rgba(10,31,48,.6)}
.vd{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;
  padding:2px 6px;border-radius:2px;font-weight:600;white-space:nowrap}
.vd-new{background:rgba(28,192,106,.2);color:#0C6A39}
.vd-known{background:rgba(56,152,239,.18);color:#1F5FA8}
.vd-person{background:rgba(10,31,48,.09);color:rgba(10,31,48,.55)}
.vd-unsure{background:rgba(232,163,61,.22);color:#8C5B0D}
.vd-junk{background:rgba(210,84,74,.14);color:#9C332B}
.prfilter{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}

/* documents */
.docs{display:grid;gap:10px}
.dochead{background:linear-gradient(120deg,var(--panel),#0C2B33);border:1px solid rgba(255,255,255,.12);
  border-radius:3px;padding:18px 20px;color:#fff}
.dochead h2{font-family:var(--disp);font-size:19px;margin:0 0 5px;letter-spacing:-.01em}
.dochead p{margin:0 0 12px;font-size:13.5px;color:rgba(255,255,255,.88);max-width:840px}
.dochead .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.folderpath{font-family:var(--mono);font-size:11.5px;background:rgba(62,207,239,.15);color:var(--cyan);
  padding:6px 10px;border-radius:3px}
.docwarn{font-family:var(--mono);font-size:11px;color:#FFD79A;background:rgba(232,163,61,.18);
  padding:6px 10px;border-radius:3px}
.doctable{width:100%;font-size:13px}
.doctable th{background:rgba(10,31,48,.07);color:var(--ink);position:static;font-family:var(--mono);
  font-size:9px;letter-spacing:.09em;text-transform:uppercase;padding:8px 9px;text-align:left}
.doctable td{padding:9px;border-bottom:1px solid rgba(10,31,48,.08);vertical-align:middle}
.doctable td.c{text-align:center;font-family:var(--mono);font-size:12px;color:rgba(10,31,48,.75)}
.fname{font-weight:700;color:#08192A}
.ftype{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 6px;border-radius:2px;margin-left:7px}
.t-csv{background:rgba(28,192,106,.2);color:#0C6A39}
.t-xlsx{background:rgba(3,98,118,.16);color:#03566A}
.docbtn{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:5px 9px;
  border-radius:2px;background:rgba(10,31,48,.08);color:rgba(10,31,48,.8);border:1px solid transparent;cursor:pointer;
  font-weight:600;margin-right:4px}
.docbtn:hover{background:var(--ink);color:#fff}
.docbtn.pri{background:rgba(62,207,239,.22);color:#0A4E5E}
.sheetpick{display:flex;gap:4px;flex-wrap:wrap}
.docempty{padding:34px;text-align:center;color:rgba(10,31,48,.55);font-size:13.5px}

/* dashboard */
.dash{display:grid;gap:10px}
.dgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.dcard{background:var(--paper);color:var(--ink);border-radius:3px;padding:16px 18px}
.dcard h3{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:#0E6E86;margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid rgba(10,31,48,.12)}
.hero{background:linear-gradient(120deg,var(--panel),#0C2B33);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:3px;padding:20px 22px;
  display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.hero .big{font-family:var(--disp);font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1}
.hero .big s{text-decoration:none;font-family:var(--mono);font-size:15px;font-weight:400;opacity:.85}
.hero .cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--cyan);margin-bottom:6px}
.hero .sm{font-family:var(--disp);font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.hero .note{font-family:var(--mono);font-size:10.5px;margin-top:5px;opacity:.9}
.hero .ok{color:#7FE9AE}.hero .bad{color:#F6C97E}
.hero .wide{grid-column:1/-1}
.htrack{height:8px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden;position:relative;margin-top:4px}
.htrack i{display:block;height:100%;background:var(--emerald);border-radius:4px}
.htrack u{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;opacity:.85}
.hlegend{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;margin-top:6px;opacity:.9}

.frow{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.frow .fl{font-size:13px;flex:0 0 150px;color:rgba(10,31,48,.9)}
.frow .fb2{flex:1;height:20px;background:rgba(10,31,48,.07);border-radius:2px;overflow:hidden}
.frow .fb2 i{display:block;height:100%;background:linear-gradient(90deg,#036276,#1CC06A);border-radius:2px}
.frow .fn{font-family:var(--mono);font-size:12px;flex:0 0 88px;text-align:right;color:rgba(10,31,48,.9)}
.frow .fp{font-family:var(--mono);font-size:11px;flex:0 0 46px;text-align:right;color:rgba(10,31,48,.55)}

.dtable{width:100%;font-size:12.5px}
.dtable th{background:rgba(10,31,48,.07);color:var(--ink);position:static;font-family:var(--mono);
  font-size:9px;letter-spacing:.09em;text-transform:uppercase;padding:7px 8px;text-align:left}
.dtable td{padding:7px 8px;border-bottom:1px solid rgba(10,31,48,.08)}
.dtable td.c{text-align:center;font-family:var(--mono)}
.minibar{height:6px;background:rgba(10,31,48,.1);border-radius:3px;overflow:hidden;margin-top:4px}
.minibar i{display:block;height:100%;background:var(--emerald);border-radius:3px}
.pill{display:inline-block;font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:2px;
  background:rgba(10,31,48,.08);color:rgba(10,31,48,.75)}
.dnote{font-size:12.5px;color:rgba(10,31,48,.7);margin-top:10px;line-height:1.45}
.alert{background:rgba(210,84,74,.14);border-left:2px solid var(--rust);padding:9px 12px;border-radius:0 3px 3px 0;
  font-size:12.5px;color:#8C2E26;margin-top:10px}
.good{background:rgba(28,192,106,.14);border-left:2px solid var(--emerald);padding:9px 12px;border-radius:0 3px 3px 0;
  font-size:12.5px;color:#0C6A39;margin-top:10px}

/* ---- tabs ---- */
.tabs{display:flex;gap:2px;margin:14px 0 0;align-items:flex-end}
.tabgap{width:20px;flex:none}
.tab{font-family:var(--disp);font-size:14.5px;font-weight:600;padding:9px 18px;cursor:pointer;
  border:1px solid var(--rule);border-bottom:none;border-radius:3px 3px 0 0;
  background:var(--bg2);color:#fff}
.tab .n{font-family:var(--mono);font-size:11px;margin-left:8px;color:var(--cyan)}
.tab:hover{background:var(--panel)}
.tab.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.tab.on .n{color:rgba(10,31,48,.55)}

.panel{background:var(--bg2);border:1px solid var(--rule);border-radius:0 3px 3px 3px;padding:12px}
.controls{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:10px}
select,input[type=search],input[type=number]{font-family:var(--body);font-size:13.5px;padding:6px 9px;
  border-radius:3px;border:1px solid rgba(255,255,255,.18);background:var(--card);color:#fff}
select option{background:var(--panel);color:#fff}
input[type=search]{min-width:190px}
input::placeholder{color:rgba(255,255,255,.35)}
button,.filebtn{font-family:var(--body);font-size:13.5px;font-weight:600;cursor:pointer;border-radius:3px;
  border:1px solid transparent;padding:6px 12px;background:none;color:inherit;transition:.13s;
  display:inline-block;white-space:nowrap}
button:focus-visible,select:focus-visible,input:focus-visible,.filebtn:focus-within{outline:2px solid var(--blue);outline-offset:2px}
.ghost{border-color:rgba(255,255,255,.2);color:#fff;background:var(--card)}
.ghost:hover{border-color:var(--cyan);background:var(--panel)}
.ghost:disabled{opacity:.3;cursor:not-allowed}
.solid{background:var(--emerald);color:#04231A;border-color:var(--emerald);font-weight:700}
.solid:hover{filter:brightness(1.1)}
.solid:disabled{opacity:.3;cursor:not-allowed;filter:none}
.warn{background:rgba(210,84,74,.2);border-color:rgba(210,84,74,.55);color:#FFC0BA}
.warn:hover{background:rgba(210,84,74,.3)}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;
  border-radius:3px;border:1px solid rgba(255,255,255,.2);background:var(--card);color:#fff;cursor:pointer}
.chip:hover{border-color:var(--cyan)}
.chip.on{background:rgba(62,207,239,.2);border-color:var(--cyan);color:#fff}
.spacer{flex:1}
.sep{width:1px;height:22px;background:rgba(255,255,255,.18)}
.whoami{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--cyan)}
.whoami select{font-family:var(--body);font-size:13px;text-transform:none;letter-spacing:0;color:#fff}
.byc{font-family:var(--mono);font-size:11px;color:rgba(10,31,48,.8);line-height:1.4}
.byc s{text-decoration:none;display:block;font-size:10px;color:rgba(10,31,48,.55)}

.bulkbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:9px 11px;margin-bottom:9px;

.hidden{display:none!important}
.bulkbar.hidden{display:flex!important;visibility:hidden;pointer-events:none}

.tablewrap{background:var(--paper);color:var(--ink);border-radius:3px;overflow:auto;

body.kpi-off .tablewrap{max-height:calc(100vh - 210px)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
thead th{position:sticky;top:0;z-index:3;background:#0C2029;color:#fff;text-align:left;

thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{background:#153744}
thead th .ar{opacity:.45;margin-left:4px}
tbody td{padding:var(--rowpad) 8px;border-bottom:1px solid rgba(10,31,48,.09);vertical-align:top}
tbody tr:hover{background:rgba(56,152,239,.06)}
tbody tr.sel{background:rgba(56,152,239,.14)}
tbody tr.touched{background:rgba(28,192,106,.08)}
tbody tr.touched.sel{background:rgba(56,152,239,.16)}
.chk{width:14px;height:14px;accent-color:#0E6E86;cursor:pointer;margin-top:2px}

.co{font-weight:700;font-size:14px;line-height:1.25;max-width:250px;color:#08192A}
.sub{font-family:var(--mono);font-size:11px;color:rgba(10,31,48,.68);margin-top:2px;word-break:break-all}
.search-as{display:inline-block;font-family:var(--mono);font-size:11px;margin-top:3px;

.rechk{display:inline-block;font-family:var(--mono);font-size:10px;margin-top:3px;margin-left:4px;

.lic{display:inline-block;font-family:var(--mono);font-size:10.5px;margin-top:3px;margin-left:3px;
  background:rgba(10,31,48,.08);color:rgba(10,31,48,.6);padding:1px 5px;border-radius:2px}
.ptype{font-size:12px;color:rgba(10,31,48,.78);max-width:190px;line-height:1.3;

.num{font-family:var(--mono);font-size:13px;text-align:right;white-space:nowrap}
.geo{font-size:12px;color:rgba(10,31,48,.85);max-width:172px;line-height:1.28}

.compact .ptype,.compact .why,.compact .sub{display:none}

.vert{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;

.vWindowsDoorsSiding{background:rgba(139,111,214,.18);color:#57408F}
.vSolar{background:rgba(232,163,61,.24);color:#8C5B0D}
.vMechanicalHVAC{background:rgba(3,98,118,.15);color:#03566A}
.vElectrical{background:rgba(28,192,106,.18);color:#0C6A39}
.vPlumbing{background:rgba(10,31,48,.12);color:#0A1F30}

.badge{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;

.b-confirmed{background:rgba(28,192,106,.2);color:#0C6A39}
.b-likely{background:rgba(56,152,239,.18);color:#1F5FA8}
.b-conflict{background:rgba(232,163,61,.22);color:#8C5B0D}
.b-employer{background:rgba(139,111,214,.2);color:#57408F}
.b-unusable{background:rgba(10,31,48,.09);color:rgba(10,31,48,.55)}
.why{font-size:11.5px;color:rgba(10,31,48,.72);margin-top:3px;max-width:215px;line-height:1.3;

.go{display:flex;gap:3px;flex-wrap:wrap;max-width:210px}

.go a:hover,.go button:hover{background:var(--ink);color:#fff}

.stamp{font-family:var(--mono);font-size:11px;color:rgba(10,31,48,.72);line-height:1.5}

.empty{padding:46px;text-align:center;color:rgba(10,31,48,.5);font-size:13px}

.help td{padding:7px 9px;border-bottom:1px solid rgba(10,31,48,.08);vertical-align:top}

<script>

const FREEMAIL=new Set(['gmail.com','yahoo.com','yahoo.es','aol.com','hotmail.com','outlook.com','icloud.com',
 'msn.com','live.com','me.com','mac.com','ymail.com','rocketmail.com','comcast.net','bellsouth.net','att.net',
 'verizon.net','sbcglobal.net','earthlink.net','charter.net','cox.net','windstream.net','embarqmail.com',
 'tampabay.rr.com','cfl.rr.com','carolina.rr.com','protonmail.com','mail.com','centurylink.net']);
const AGGREGATOR=new Set(['buildzoom.com','blockrenovation.com','buzzfile.com','activatemylicense.com',
 'tempemail.tmp','ecslimited.com','metrocode.com','example.com','noemail.com','email.com','test.com']);
/* Dead mailboxes and placeholders. These are not filing services and never appear
   on a blocklist twice, so they are matched by shape: suspended@account.com. */
const PLACEHOLDER=/^(account|accounts|noreply|no-reply|donotreply|mail|email|user|admin|none|null|na|test|temp|placeholder|suspended|inactive|unknown|example)\.(com|net|org|info|co)$/i;
const COMPETITOR=new Set(['permitflowteam.com','expeditepermit.com']);
const ENTITY=/\b(LLC|L\.?L\.?C|INC|INCORPORATED|CORP|CORPORATION|CO|COMPANY|LP|LLP|LTD|PLLC|PA|DBA|THE|AND|OF)\b/g;
const TRADE=new Set(['ROOFING','ROOF','ROOFERS','PLUMBING','PLUMBER','ELECTRIC','ELECTRICAL','HVAC','HEATING',
 'AIR','COOLING','MECHANICAL','SOLAR','WINDOWS','WINDOW','DOORS','DOOR','SIDING','GLASS','CONSTRUCTION',
 'CONTRACTING','CONTRACTORS','CONTRACTOR','BUILDERS','BUILDER','HOMES','HOME','SERVICES','SERVICE','SOLUTIONS',
 'GROUP','ENTERPRISES','SYSTEMS','INDUSTRIES','DEVELOPMENT','REMODELING','RESTORATION','SPECIALIST',
 'SPECIALISTS','EXTERIORS','EXTERIOR','GENERAL','RESIDENTIAL','COMMERCIAL','PROFESSIONAL','QUALITY','CUSTOM',
 'AMERICAN','NATIONAL','PREMIER','ELITE','ADVANCED','ALL','PRO']);

const cleanName=s=>String(s||'').replace(/\([^)]*\)/g,' ')
  .replace(/\b[A-Z]{2,4}\s?\d{5,}\b/gi,' ').replace(/[-–—]\s*[A-Z0-9]{4,}\b/g,' ')
  .replace(/[^A-Za-z0-9\s&]/g,' ').replace(/\s+/g,' ').trim();
const tokens=n=>cleanName(n).toUpperCase().replace(ENTITY,' ').split(/\s+/).filter(t=>t.length>1&&!/^\d+$/.test(t));
const domainOf=e=>{const p=String(e||'').split('@');return p.length===2?p[1].toLowerCase().trim():''};
const domCore=d=>{const s=d.replace(/^www\./,'').split('.');
  return s.slice(0,Math.max(1,s.length-1)).join('').replace(/[^a-z0-9]/g,'')};
const domWords=d=>{const s=d.replace(/^www\./,'').split('.');
  const keep=s.length>2?s.slice(0,-1):[s[0]].concat(/^(com|net|org|co|us|biz|info)$/.test(s[1]||'')?[]:[s[1]]);
  return keep.join(' ').replace(/[-_]/g,' ').replace(/\s+/g,' ').trim()};

function verify(rec){
  const dom=domainOf(rec.email),core=domCore(dom);
  const toks=tokens(rec.name),distinct=toks.filter(t=>!TRADE.has(t)&&t.length>2);
  const compressed=toks.join('').toLowerCase();
  const base={dom,core};
  if(!dom) return {...base,verdict:'unusable',why:'No email on this record — search by company name.'};
  if(AGGREGATOR.has(dom)) return {...base,verdict:'unusable',why:'Data aggregator domain, not the contractor.'};
  if(COMPETITOR.has(dom)) return {...base,verdict:'unusable',why:'A competitor filed this — strong target. Search by name.'};
  if(FREEMAIL.has(dom)) return {...base,verdict:'unusable',why:'Free email provider — no company site to derive.'};
  if(PLACEHOLDER.test(dom)) return {...base,verdict:'unusable',
    why:'Placeholder or dead mailbox, not a real company domain — search by company name.'};
  let score=0;const why=[];
  if(compressed&&core.includes(compressed)){score+=60;why.push('Domain contains the full name.')}
  const matched=distinct.filter(t=>core.includes(t.toLowerCase())&&t.length>3);
  if(matched.length&&score<60){score+=matched.length===distinct.length?45:28;why.push('Matched: '+matched.join(', ')+'.')}
  const tm=toks.filter(t=>TRADE.has(t)&&core.includes(t.toLowerCase()));
  if(tm.length){score+=8;if(!matched.length)why.push('Trade word only: '+tm.join(', ')+'. Weak on its own.')}
  const ini=distinct.map(t=>t[0]).join('').toLowerCase();
  if(ini.length>=2&&core.startsWith(ini)&&score<45){score+=25;why.push('Opens with initials '+ini.toUpperCase()+'.')}
  if(rec.group>1) return {...base,verdict:'employer',
    why:rec.group+' records share '+dom+' — one employer, not '+rec.group+' companies. Search the employer.'};
  if(score===0) return {...base,verdict:'conflict',
    why:'Name and domain disagree. The domain is probably the operating firm — search that instead.'};
  if(score>=55) return {...base,verdict:'confirmed',why:why.join(' ')};
  return {...base,verdict:'likely',why:why.join(' ')};
}
const VERD={confirmed:'Confirmed',likely:'Likely',conflict:'Check domain',
  employer:'Employer group',unusable:'By name only'};

const BOARDS={

const LICENSE=/\b([A-Z]{2,4}\s?\d{5,9})\b/;
const licenseNo=n=>{const m=String(n||'').toUpperCase().match(LICENSE);return m?m[1].replace(/\s/g,''):''};
/* Markers that make a record name a usable business name on its own. */
const COMPANY_MARKER=/\b(LLC|L\.?L\.?C|INC|INCORPORATED|CORP|CORPORATION|COMPANY|CO|LP|LLP|LTD|PLLC|PA|DBA|GROUP|ENTERPRISES?|SERVICES?|SOLUTIONS?|SYSTEMS?|INDUSTRIES|ASSOCIATES|PARTNERS|HOLDINGS|CONTRACTING|CONSTRUCTION)\b/i;

/* The name wins when it is a company in its own right — an entity marker, a
   trade word, or a state licence number attached to it. Only a bare personal
   name with nothing else is insufficient, and only then does the domain take
   over. This stops a real firm like "Reliable Shutters & Screens LLC" being
   searched as the domain of whoever filed its permits. */
function nameIsSufficient(name){
  const raw=String(name||'');
  if(licenseNo(raw)) return true;
  if(COMPANY_MARKER.test(raw)) return true;
  if(tokens(raw).some(t=>TRADE.has(t))) return true;
  return false;
}
function searchTerm(rec,chk){
  if(nameIsSufficient(rec.name)) return {term:cleanName(rec.name),src:''};
  if(chk.verdict==='employer'||chk.verdict==='conflict'){
    const w=domWords(chk.dom); if(w) return {term:w,src:'from domain'};}
  return {term:cleanName(rec.name),src:''};
}

/* ================= state ================= */
/* Two domains belong to one parent when the shorter is a stem of the longer —
   frankgayservices.com and frankgaycommercial.com are the same business. */
function parentStem(core){
  const SUF=['services','service','commercial','residential','construction','contracting',
             'group','inc','llc','corp','usa','air','mechanical','plumbing','electric',
             'electrical','roofing','homes','builders','co'];
  let c=core;
  for(const s of SUF){ if(c.length>s.length+3 && c.endsWith(s)){ c=c.slice(0,-s.length); break } }
  return c;
}

/* Recomputed across the whole loaded set: sibling domains of one parent count as
   the same employer, and a file with no "Records on Domain" column still works. */
function computeGroups(raw){
  const byDom={}, byStem={};
  raw.forEach(r=>{const d=domainOf(r.e); if(!d)return;
    if(FREEMAIL.has(d)||AGGREGATOR.has(d)||COMPETITOR.has(d)||PLACEHOLDER.test(d))return;
    byDom[d]=(byDom[d]||0)+1;
    const st=parentStem(domCore(d)); if(st.length>3) byStem[st]=(byStem[st]||0)+1;});
  return r=>{const d=domainOf(r.e); if(!d)return r.g||0;
    const st=parentStem(domCore(d));
    return Math.max(r.g||0, byDom[d]||0, st.length>3?(byStem[st]||0):0);};
}
function build(raw){
  const groupOf=computeGroups(raw);
  return raw.map(r=>{
    const rec={name:r.n,vert:r.v,permits:r.p,score:r.s,email:r.e,juris:r.j,metro:r.m,
               state:r.st,types:r.t,group:groupOf(r)};
    const chk=verify(rec),s=searchTerm(rec,chk);
    return {...rec,chk,term:s.term,src:s.src,
      stage:r.stage||'research',
      fb:r.fb??null,ig:r.ig??null,li:r.li??null,
      dfb:r.dfb||'',dig:r.dig||'',dli:r.dli||'',
      bfb:r.bfb??null,big:r.big??null,bli:r.bli??null,
      eng:r.eng||0,note:r.note||'',rby:r.rby||'',rdate:r.rdate||'',
      recheck:r.recheck||false,seen:r.seen||'',skip:r.skip||'',sel:false};
  });
}

const PLAN={

function fillFilters(){
  [['fVert','vert','verticals'],['fState','state','states']].forEach(([id,k,lbl])=>{
    const sel=$('#'+id),cur=sel.value;
    sel.innerHTML='<option value="">All '+lbl+'</option>';
    [...new Set(rows.map(r=>r[k]).filter(Boolean))].sort().forEach(x=>{
      const o=document.createElement('option');o.value=x;o.textContent=x;sel.appendChild(o)});
    sel.value=cur;});
  const sv=$('#fVerd');
  if(sv.options.length<2) Object.entries(VERD).forEach(([k,l])=>{
    const o=document.createElement('option');o.value=k;o.textContent=l;sv.appendChild(o)});
}
const found=r=>(r.fb===true?1:0)+(r.ig===true?1:0)+(r.li===true?1:0);
/* A skipped row is out of scope entirely — it must not count as "checked", or a
   Home Depot with no contractor relevance drags the platform hit rate down. */
const isSkipped=r=>!!r.skip;
const touchedRow=r=>!isSkipped(r)&&(r.fb!==null||r.ig!==null||r.li!==null);
const followedN=r=>(r.dfb?1:0)+(r.dig?1:0)+(r.dli?1:0);

function filtered(){
  const fv=$('#fVert').value,fd=$('#fVerd').value,fs=$('#fState').value,
        t=$('#fText').value.trim().toLowerCase();
  let out=rows.filter(r=>{
    if(r.stage!==tab)return false;
    if(fv&&r.vert!==fv)return false;
    if(fd&&r.chk.verdict!==fd)return false;
    if(fs&&r.state!==fs)return false;
    const fby=$('#fBy').value; if(fby&&r.rby!==fby)return false;
    if(todoOnly&&(tab==='research'?touchedRow(r):followedN(r)>0))return false;
    if(empOnly&&r.chk.verdict!=='employer')return false;
    if(t&&!((r.name+' '+r.chk.dom+' '+r.juris+' '+r.metro+' '+r.term).toLowerCase().includes(t)))return false;
    return true;});
  const key=sortKey;
  out.sort((a,b)=>{
    if(tab==='research'&&(a.recheck!==b.recheck))return a.recheck?-1:1;
    let x=a[key],y=b[key];
    if(key==='chk'){x=a.chk.verdict;y=b.chk.verdict}
    if(typeof x==='string'||typeof y==='string'){x=String(x||'').toLowerCase();y=String(y||'').toLowerCase();
      return x<y?-sortDir:x>y?sortDir:0}
    return ((x||0)-(y||0))*sortDir;});
  return out;
}
const TRADEWORD={'Homebuilders':'home builder','Roofing':'roofing contractor',
 'Windows-Doors-Siding':'windows and doors contractor','Solar':'solar installer',
 'Mechanical-HVAC':'HVAC contractor','Electrical':'electrical contractor','Plumbing':'plumbing contractor'};
const artFor=s=>/^(a|e|i|o|u|hvac)/i.test(s)?'an':'a';

/* Google AI Mode (udm=50). Three prompt shapes, strongest anchor first:
     1. WEBSITE  — the domain is the company's own. One business, no ambiguity.
                   This is the method that took research from 3 min to ~1 min.
     2. LICENCE  — no usable domain, but a state licence number. Resolves
                   generic names that search alone cannot ("Patriot Electric").
     3. NAME     — last resort. Adds the metro only as a hint, never as a fact,
                   because our jurisdiction is where the PERMIT was pulled, not
                   where the business is based. */
function aiPrompt(r){
  const trade=TRADEWORD[r.vert]||'contractor';
  const tail=' For each of the three, give the direct profile URL. If you cannot find a '+
    'genuine account for one, say plainly that it does not exist rather than offering a '+
    'similarly named business. Check each platform directly — do not infer from the website alone.';
  const site=usableSite(r);
  if(site)
    return 'This is the website of '+artFor(trade)+' '+trade+': '+site+
      '. Find that same company\'s official Facebook page, Instagram profile and LinkedIn company page.'+tail;
  const lic=licenseNo(r.name);
  if(lic)
    return 'Find the '+trade+' holding '+r.state+' contractor licence '+lic+
      ' (listed as "'+cleanName(r.name)+'"). Confirm the business name and city from the licence record, '+
      'then find its official Facebook page, Instagram profile and LinkedIn company page.'+tail;
  const metro=String(r.metro||'').replace(/\s*\/.*$/,'').trim();
  return 'Find the official Facebook page, Instagram profile and LinkedIn company page for "'+r.term+
    '", '+artFor(trade)+' '+trade+' in '+r.state+
    (metro&&metro!=='—'?' (it pulled permits near '+metro+', though it may be based elsewhere)':'')+'.'+tail;
}
/* The domain is only an identity anchor when it is the company's own. Aggregator,
   freemail, competitor and shared-filer domains are somebody else's website. */
function usableSite(r){
  if(!r.chk.dom||r.chk.verdict==='unusable')return '';
  if(r.chk.verdict==='conflict'&&(r.group||0)<=1)return '';
  return 'https://'+r.chk.dom.replace(/^www\./,'');
}
function urlsFor(r){
  const city=String(r.juris&&r.juris!=='—'?r.juris:r.metro||'').replace(/\(.*\)/,'').trim();
  return {site:usableSite(r),
    ai:'https://www.google.com/search?udm=50&q='+q(aiPrompt(r)),
    gg:'https://www.google.com/search?q='+q('"'+r.term+'" '+city+' '+r.state+' contractor'),
    fb:'https://www.facebook.com/search/pages/?q='+q(r.term+' '+city),
    ig:'https://www.instagram.com/explore/search/keyword/?q='+q(r.term),
    li:'https://www.linkedin.com/search/results/companies/?keywords='+q(r.term),
    lic:licenseNo(r.name),bd:board(r.state,r.vert)};
}

let lastTab='research';
function draw(){
  const tw=document.querySelector('.tablewrap');
  const keep=tw?tw.scrollTop:0;
  const wy=window.scrollY;
  const same=(lastTab===tab);
  lastTab=tab;
  drawInner();
  if(same){
    const nw=document.querySelector('.tablewrap');
    if(nw&&keep)nw.scrollTop=keep;
    if(wy)window.scrollTo(0,wy);
  }
}
function drawInner(){
  if(tab==='help'){$('#toolbar').classList.add('hidden');$('#pager').innerHTML='';
    $('#view').innerHTML=HELP;$('#shown').textContent='';$('#hint').textContent='';counts();return}
  if(tab==='trends'){$('#toolbar').classList.add('hidden');$('#pager').innerHTML='';
    $('#view').innerHTML=trendHTML();bindTrend();$('#shown').textContent='';
    $('#hint').innerHTML='Buckets come from the dates stamped when work was done. Dashed lines are the previous period of equal length.';
    counts();return}
  if(tab==='prospect'){$('#toolbar').classList.add('hidden');$('#pager').innerHTML='';
    $('#view').innerHTML=prospectHTML();bindProspect();$('#shown').textContent='';
    $('#hint').innerHTML='Paste a follower or following list. Everything is filtered free before anything reaches a paid lookup.';
    counts();return}
  if(tab==='docs'){$('#toolbar').classList.add('hidden');$('#pager').innerHTML='';
    $('#view').innerHTML=docsHTML();bindDocs();$('#shown').textContent='';
    $('#hint').innerHTML='Connect a folder once per session and this becomes a browser for your saved lists.';
    counts();return}
  if(tab==='dash'){$('#toolbar').classList.add('hidden');$('#pager').innerHTML='';
    $('#view').innerHTML=dashHTML();$('#shown').textContent='';
    $('#hint').innerHTML='Everything here reads from the three working tabs. Nothing to fill in.';
    counts();return}
  if(tab==='rates'){$('#toolbar').classList.add('hidden');$('#pager').innerHTML='';
    $('#view').innerHTML=ratesHTML();bindRates();$('#shown').textContent='';
    $('#hint').innerHTML='Edit the plan directly, or press Apply to push a measured rate into it. KPI targets follow automatically.';
    counts();return}
  $('#toolbar').classList.remove('hidden');
  const all=filtered();
  const pages=Math.max(1,Math.ceil(all.length/perPage));
  if(page>=pages)page=pages-1;
  const slice=all.slice(page*perPage,(page+1)*perPage);
  const heads=HEADS[tab];
  const thead='<thead><tr>'+heads.map(([l,k,c])=>
    l===''?'<th><input type="checkbox" class="chk" id="selAll"></th>'
    :'<th class="'+c+'" '+(k?'data-sort="'+k+'"':'')+'>'+l+
      (sortKey===k?'<span class="ar">'+(sortDir>0?'▲':'▼')+'</span>':'')+'</th>').join('')+'</tr></thead>';

  let body;
  if(!rows.length) body='<tr><td colspan="'+heads.length+'" class="empty">No records loaded.<br>Use <b>Import CSV</b> to load a list.</td></tr>';
  else if(!all.length) body='<tr><td colspan="'+heads.length+'" class="empty">'+
    (tab==='follow'?'Nothing here yet. Mark rows on <b>Research</b> and use <b>Send to Follow</b>.'
     :tab==='archive'?'Nothing archived yet.':'Nothing matches those filters.')+'</td></tr>';
  else body=slice.map(r=>rowHTML(r)).join('');

  $('#view').innerHTML='<div class="tablewrap'+(compact?' compact':'')+'"><table>'+thead+'<tbody>'+body+'</tbody></table></div>';
  bind();
  $('#pager').innerHTML=pages>1?
    '<button class="ghost" id="pPrev"'+(page===0?' disabled':'')+'>← Prev</button>'+
    '<span>Page '+(page+1)+' of '+pages+'</span>'+
    '<button class="ghost" id="pNext"'+(page>=pages-1?' disabled':'')+'>Next →</button>'+
    '<span class="spacer"></span><span>'+perPage+' per page</span>':'';
  if(pages>1){$('#pPrev').onclick=()=>{page--;draw()};$('#pNext').onclick=()=>{page++;draw()}}
  $('#shown').textContent=all.length.toLocaleString()+' in '+tab+' · '+rows.length.toLocaleString()+' total · '+source;
  $('#hint').innerHTML=tab==='research'
    ? 'Start with <b>AI ✦</b> — it anchors on the company website where there is one. <b>FB/IG/LI</b> cycle found → none → clear. <b>✕</b> marks a row as not a target, excluded from hit rates.'
    : tab==='follow' ? 'Click a platform button to stamp today\'s date once you have actually followed them. <b>B</b> marks a follow-back.'
    : 'Completed records. Export, then remove them so next month\'s queue starts clean.';
  counts();
}

function rowHTML(r){
  const i=rows.indexOf(r),u=urlsFor(r);
  const vc='v'+String(r.vert||'').replace(/[^A-Za-z]/g,'');
  const cell0='<td><input type="checkbox" class="chk rsel" data-i="'+i+'"'+(r.sel?' checked':'')+'></td>';
  const co='<td><div class="co">'+esc(r.name)+'</div><div class="sub">'+esc(r.email||'—')+'</div>'+
    (r.src?'<span class="search-as">searching “'+esc(r.term)+'” '+esc(r.src)+'</span>':'')+
    (u.lic?'<span class="lic">lic '+esc(u.lic)+'</span>':'')+
    (r.recheck?'<span class="rechk">recheck</span>':'')+'</td>';
  const vt='<td><span class="vert '+vc+'">'+esc(r.vert)+'</span></td>';
  const pm='<td class="num">'+(Number(r.permits)||0).toLocaleString()+'</td>';
  const wh='<td><div class="geo"><b>'+esc(r.state)+'</b> · '+esc(r.juris)+'<br>'+esc(r.metro)+'</div></td>';
  const mk=(p,l)=>'<button class="mk '+(r[p]===true?'yes':r[p]===false?'no':'')+'" data-i="'+i+'" data-mk="'+p+'">'+l+'</button>';
  const dt=(p,l)=>'<button class="mk '+(r[p]?'date':'')+'" data-i="'+i+'" data-dt="'+p+'" title="'+(r[p]||'not yet')+'">'+l+'</button>';
  const bk=(p,l)=>'<button class="mk '+(r[p]===true?'yes':r[p]===false?'no':'')+'" data-i="'+i+'" data-bk="'+p+'">'+l+'</button>';

  if(r.stage==='research') return '<tr class="'+(r.sel?'sel ':'')+(touchedRow(r)?'touched':'')+'">'+cell0+co+vt+
    '<td><div class="ptype">'+esc(r.types||'—')+'</div></td>'+pm+wh+
    '<td><span class="badge b-'+r.chk.verdict+'">'+VERD[r.chk.verdict]+'</span><div class="why">'+esc(r.chk.why||'')+'</div></td>'+
    '<td><div class="go">'+
      '<a class="aimode" href="'+u.ai+'" target="_blank" rel="noopener" '+
        'title="Google AI Mode — asks for all three profiles in one query">AI ✦</a>'+
      '<button class="all" data-all="'+i+'">All</button>'+
      (u.site?'<a class="site" href="'+u.site+'" target="_blank" rel="noopener">Site</a>':'')+
      '<a href="'+u.gg+'" target="_blank" rel="noopener">Google</a>'+
      '<a href="'+u.fb+'" target="_blank" rel="noopener">FB</a>'+
      '<a href="'+u.ig+'" target="_blank" rel="noopener">IG</a>'+
      '<a href="'+u.li+'" target="_blank" rel="noopener">LI</a>'+
      (u.bd?'<a class="lic-btn" href="'+u.bd.u+'" target="_blank" rel="noopener" title="'+
        (u.lic?'Search licence '+esc(u.lic):'Search by name')+' — '+esc(u.bd.n)+'">'+esc(u.bd.n)+(u.lic?' ⚲':'')+'</a>':'')+
    '</div></td>'+
    '<td><div class="marks">'+mk('fb','FB')+mk('ig','IG')+mk('li','LI')+
      '<button class="mk skipb'+(r.skip?' on':'')+'" data-i="'+i+'" data-skip="1" '+
      'title="Not a target — exclude from hit rates">✕</button></div></td>'+
    '<td><textarea class="noteIn rnote" data-i="'+i+'" data-note="1" rows="2" '+
      'placeholder="real company name, profile links, anything worth keeping">'+esc(r.note)+'</textarea></td>'+
    '<td>'+(touchedRow(r)
      ? '<div class="byc"><select class="bysel" data-i="'+i+'" data-by="1">'+
          TEAM.map(t=>'<option'+(t===r.rby?' selected':'')+'>'+t+'</option>').join('')+
        '</select><s>'+esc(r.rdate||'')+'</s></div>'
      : '<span class="stamp">—</span>')+'</td></tr>';

  if(r.stage==='follow') return '<tr class="'+(r.sel?'sel ':'')+(followedN(r)?'touched':'')+'">'+cell0+co+vt+pm+wh+
    '<td><div class="go">'+
      '<a class="aimode" href="'+u.ai+'" target="_blank" rel="noopener" '+
        'title="Google AI Mode — re-check this company">AI ✦</a>'+
      (u.site?'<a class="site" href="'+u.site+'" target="_blank" rel="noopener">Site</a>':'')+
      (r.fb===true?'<a href="'+u.fb+'" target="_blank" rel="noopener">FB</a>':'')+
      (r.ig===true?'<a href="'+u.ig+'" target="_blank" rel="noopener">IG</a>':'')+
      (r.li===true?'<a href="'+u.li+'" target="_blank" rel="noopener">LI</a>':'')+

    '<td><div class="marks">'+(r.fb===true?dt('dfb','FB'):'')+(r.ig===true?dt('dig','IG'):'')+
      (r.li===true?dt('dli','LI'):'')+'</div></td>'+
    '<td><div class="marks">'+(r.fb===true?bk('bfb','FB'):'')+(r.ig===true?bk('big','IG'):'')+

    '<td><input class="eng" type="number" min="0" value="'+(r.eng||0)+'" data-i="'+i+'" data-eng="1"></td>'+
    '<td><input class="noteIn" value="'+esc(r.note)+'" data-i="'+i+'" data-note="1" placeholder="notes"></td></tr>';

  return '<tr class="'+(r.sel?'sel':'')+'">'+cell0+co+vt+pm+wh+
    '<td class="stamp">'+found(r)+' of 3</td>'+
    '<td class="stamp">'+[r.dfb&&'FB '+r.dfb,r.dig&&'IG '+r.dig,r.dli&&'LI '+r.dli].filter(Boolean).join('<br>')+'</td>'+
    '<td class="stamp">'+[r.bfb===true&&'FB',r.big===true&&'IG',r.bli===true&&'LI'].filter(Boolean).join(' ')+'</td>'+
    '<td class="stamp">'+esc(r.rby||'—')+'<br>'+esc(r.rdate||'')+'</td>'+
    '<td class="stamp">'+esc(r.note)+'</td></tr>';
}

function bind(){
  const sa=$('#selAll');
  if(sa){sa.onclick=()=>{filtered().slice(page*perPage,(page+1)*perPage).forEach(r=>r.sel=sa.checked);draw()}}
  $$('.rsel').forEach(b=>b.onclick=()=>{rows[+b.dataset.i].sel=b.checked;draw()});
  $$('[data-mk]').forEach(b=>b.onclick=()=>{const r=rows[+b.dataset.i],p=b.dataset.mk;
    r[p]=r[p]===true?false:r[p]===false?null:true;
    if(touchedRow(r))stampRow(r); else {r.rby='';r.rdate=''}
    touch();draw()});
  $$('[data-by]').forEach(s=>s.onchange=()=>{rows[+s.dataset.i].rby=s.value;touch()});
  $$('[data-skip]').forEach(b=>b.onclick=()=>{const r=rows[+b.dataset.i];
    r.skip=r.skip?'':'not a target';
    if(r.skip){r.fb=r.ig=r.li=null;r.stage='archive'}
    touch();draw()});
  $$('[data-dt]').forEach(b=>b.onclick=()=>{const r=rows[+b.dataset.i],p=b.dataset.dt;
    r[p]=r[p]?'':today();touch();draw()});
  $$('[data-bk]').forEach(b=>b.onclick=()=>{const r=rows[+b.dataset.i],p=b.dataset.bk;
    r[p]=r[p]===true?false:r[p]===false?null:true;touch();draw()});
  $$('[data-all]').forEach(b=>b.onclick=()=>{const r=rows[+b.dataset.all],u=urlsFor(r);
    [u.ai,u.site,u.fb,u.ig,u.li].filter(Boolean).forEach(x=>window.open(x,'_blank','noopener'))});
  $$('[data-eng]').forEach(el=>el.onchange=()=>{rows[+el.dataset.i].eng=+el.value||0;touch();counts()});
  $$('[data-note]').forEach(el=>{
    el.onchange=()=>{rows[+el.dataset.i].note=el.value;touch()};
    el.onblur  =()=>{rows[+el.dataset.i].note=el.value;touch()};});
  $$('th[data-sort]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.sort;
    if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=(k==='permits'||k==='score'||k==='eng')?-1:1}
    draw()});
}

const vIcon=v=>{const s=VSTYLE[v];return s?'<span class="vicon"><svg viewBox="0 0 24 24">'+s.i+'</svg></span>':''};
const pctOf=(a,b)=>b>0?Math.min(100,Math.round(a/b*100)):0;
function kpiCard(lab,note,val,target,cls,mini,icon,tint){
  const p=pctOf(val,target);
  const style=tint?' style="color:'+tint+'"':'';
  const fill=tint?' style="width:'+p+'%;background:'+tint+'"':' style="width:'+p+'%"';
  return '<div class="card'+(mini?' mini':'')+'"><div class="lab"><span class="nm"'+style+'>'+
      (icon||'')+'<span>'+lab+'</span></span><em>'+note+'</em></div>'+
    '<div class="fig">'+val.toLocaleString()+(target?'<s>/ '+target.toLocaleString()+'</s>':'')+'</div>'+
    '<div class="track"><i class="fill '+cls+'"'+fill+'></i></div>'+
    '<div class="pct"><span>'+p+'%</span><span>'+(target>val?(target-val).toLocaleString()+' to go':'target met')+'</span></div></div>';
}
function counts(){
  const n=k=>rows.filter(r=>r[k]===true).length;
  const researched=rows.filter(touchedRow).length;
  const backs=rows.filter(r=>r.bfb===true||r.big===true||r.bli===true).length;
  const followed=rows.filter(r=>followedN(r)>0).length;

  $('#kpiPlat').innerHTML=
    kpiCard('Researched','companies',researched,TARGET.research,'f-v')+
    kpiCard('Facebook','profiles found',n('fb'),TARGET.fb,'f-fb')+
    kpiCard('Instagram','profiles found',n('ig'),TARGET.ig,'f-ig')+
    kpiCard('LinkedIn','pages found',n('li'),TARGET.li,'f-li')+
    kpiCard('Followed','actually followed',followed,researched||1,'f-v')+
    kpiCard('Follow-backs','they followed us',backs,followed||1,'f-v');

  $('#kpiVert').innerHTML=Object.keys(PLAN).map(v=>{
    const inv=rows.filter(r=>r.vert===v);
    const done=inv.filter(touchedRow).length;
    const short=v.replace('Windows-Doors-Siding','Windows/Doors').replace('Mechanical-HVAC','HVAC');
    return kpiCard(short,'',done,PLAN[v].res,'',true,vIcon(v),(VSTYLE[v]||{}).c);
  }).join('');

  const now=new Date(),eom=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const left=Math.max(1,eom-now.getDate()+1);
  const remain=Math.max(0,TARGET.research-researched);
  const perDay=Math.ceil(remain/left);
  const expected=Math.round(TARGET.research*(now.getDate()/eom));
  const cls=researched>=expected?'over':'under';

function parseCSV(text){
  const out=[];let row=[],cell='',inQ=false;
  text=text.replace(/^\uFEFF/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){const c=text[i];
    if(inQ){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else inQ=false}else cell+=c}
    else if(c==='"')inQ=true;
    else if(c===','){row.push(cell);cell=''}
    else if(c==='\n'){row.push(cell);out.push(row);row=[];cell=''}
    else cell+=c}
  if(cell.length||row.length){row.push(cell);out.push(row)}
  return out.filter(r=>r.some(c=>String(c).trim()!==''));
}

const RECHECK_MONTHS=9;
const normKey=n=>String(n||'').toUpperCase()
  .replace(/\([^)]*\)/g,' ').replace(/\b[A-Z]{2,4}\s?\d{5,}\b/g,' ')
  .replace(/[^A-Z0-9\s]/g,' ').replace(ENTITY,' ').replace(/\s+/g,'').trim();
const monthsAgo=ds=>{if(!ds)return 999;
  const t=new Date(ds+'T00:00:00');if(isNaN(t))return 999;
  return (Date.now()-t)/86400000/30.44};

function buildIndex(list){
  const byEmail=new Map(), byDom=new Map(), byName=new Map();
  list.forEach((r,i)=>{
    const e=String(r.email||'').toLowerCase().trim();
    if(e&&e.includes('@')&&!byEmail.has(e))byEmail.set(e,i);
    const dom=domainOf(r.email);
    const sharedEmployer=(r.group||0)>1 || FREEMAIL.has(dom) || AGGREGATOR.has(dom) || COMPETITOR.has(dom);
    if(dom&&!sharedEmployer){const k=dom+'|'+r.state; if(!byDom.has(k))byDom.set(k,i)}
    const nk=normKey(r.name); if(nk.length>3){const k=nk+'|'+r.state; if(!byName.has(k))byName.set(k,i)}
  });
  return {byEmail,byDom,byName};
}
function findMatch(idx,rec){
  const e=String(rec.e||'').toLowerCase().trim();
  if(e&&e.includes('@')&&idx.byEmail.has(e))return {i:idx.byEmail.get(e),how:'email'};
  const dom=domainOf(rec.e);
  const shared=(rec.g||0)>1||FREEMAIL.has(dom)||AGGREGATOR.has(dom)||COMPETITOR.has(dom);
  if(dom&&!shared){const k=dom+'|'+rec.st; if(idx.byDom.has(k))return {i:idx.byDom.get(k),how:'domain'}}
  const nk=normKey(rec.n); if(nk.length>3){const k=nk+'|'+rec.st;
    if(idx.byName.has(k))return {i:idx.byName.get(k),how:'name'}}
  return null;
}
let pendingImport=null;

function planMerge(raw){
  const idx=buildIndex(rows);
  const plan={fresh:[],upd:[],recheck:[],xvert:[],how:{email:0,domain:0,name:0}};
  const seenInFile=new Set();
  raw.forEach(rec=>{
    const dupKey=(String(rec.e||'').toLowerCase()||normKey(rec.n))+'|'+rec.st;
    if(seenInFile.has(dupKey))return; seenInFile.add(dupKey);
    const m=findMatch(idx,rec);
    if(!m){plan.fresh.push(rec);return}
    plan.how[m.how]++;
    const cur=rows[m.i];
    const entry={i:m.i,rec,how:m.how};
    if(cur.vert&&rec.v&&cur.vert!==rec.v)plan.xvert.push(entry);
    const wasNone=cur.fb===false&&cur.ig===false&&cur.li===false;
    if(wasNone&&monthsAgo(cur.rdate)>=RECHECK_MONTHS)plan.recheck.push(entry);
    else plan.upd.push(entry);
  });
  return plan;
}
function applyMerge(plan){
  const refresh=(cur,rec)=>{
    cur.permits=rec.p; cur.score=rec.s; cur.types=rec.t||cur.types;
    cur.group=rec.g||cur.group; cur.juris=rec.j||cur.juris; cur.metro=rec.m||cur.metro;
    if(rec.e&&!cur.email)cur.email=rec.e;
    const chk=verify({name:cur.name,email:cur.email,group:cur.group});
    cur.chk=chk; const s=searchTerm({name:cur.name},chk); cur.term=s.term; cur.src=s.src;
    cur.seen=today();
  };
  plan.xvert.forEach(e=>{const c=rows[e.i];
    const tag='also listed as '+e.rec.v;
    if(!String(c.note||'').includes(tag))c.note=(c.note?c.note+' · ':'')+tag});
  plan.upd.forEach(e=>refresh(rows[e.i],e.rec));
  plan.recheck.forEach(e=>{const cur=rows[e.i];refresh(cur,e.rec);
    cur.fb=cur.ig=cur.li=null; cur.stage='research'; cur.recheck=true;
    cur.rby=''; cur.rdate='';});
  const add=build(plan.fresh.map(r=>({...r,stage:'research'})));
  add.forEach(r=>r.seen=today());
  rows=rows.concat(add);
  page=0; fillFilters(); touch();
}

function buckets(a,b){
  const span=Math.round((b-a)/86400000)+1;
  const unit=span<=31?'day':span<=126?'week':'month';
  const out=[];
  if(unit==='day'){for(let d=new Date(a);d<=b;d=addDays(d,1))out.push({a:iso(d),b:iso(d),
    label:d.toLocaleDateString(undefined,{month:'short',day:'numeric'})})}
  else if(unit==='week'){let s=new Date(a);
    while(s<=b){const e=addDays(s,6)>b?new Date(b):addDays(s,6);
      out.push({a:iso(s),b:iso(e),label:s.toLocaleDateString(undefined,{month:'short',day:'numeric'})});s=addDays(s,7)}}
  else{let s=new Date(a.getFullYear(),a.getMonth(),1);
    while(s<=b){const e=new Date(s.getFullYear(),s.getMonth()+1,0);
      out.push({a:iso(s>a?s:a),b:iso(e>b?b:e),label:s.toLocaleDateString(undefined,{month:'short',year:'2-digit'})});
      s=new Date(s.getFullYear(),s.getMonth()+1,1)}}

function chartSVG(series,cmpSeries,labels){

  max=Math.max(4,Math.ceil(max*1.15));
  const n=Math.max(1,labels.length-1);
  const X=i=>L+(n?i*iw/n:iw/2), Y=v=>T+ih-(v/max)*ih;
  let g='';
  for(let t=0;t<=4;t++){const v=Math.round(max*t/4),y=Y(v);
    g+='<line class="gl" x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'"/>'+
       '<text class="axt" x="'+(L-8)+'" y="'+(y+3.5)+'" text-anchor="end">'+v+'</text>'}
  const step=Math.ceil(labels.length/12);

  let p='';

  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Activity over time">'+g+p+'</svg>';

  /* ---- table ---- */
  const cols=onMets;
  const delta=(cur,prev)=>{if(!prev)return cur?'<span class="dlt up">new</span>':'<span class="dlt fl">—</span>';
    const p=Math.round((cur-prev)/prev*100);

  let rowsHTML,footHTML,dimLabel;
  if(trDim==='period'){
    dimLabel='Period';
    rowsHTML=list.slice().reverse().map(bk=>{const m=agg(base,bk);

    'Follow-backs count against the period the follow was made, since a back has no date of its own. '+
    'Find rate is records with at least one profile ÷ records researched.</div></div>';

  return '<div class="trend">'+head+chart+table+'</div>';
}

/* ================= prospecting ================= */
/* Follower/following lists pasted from a profile page. Everything here is free —
   rules only, no lookups — so a list of several thousand costs nothing to sift.
   Only what survives is worth a paid enrichment pass.

   NOTE ON PARSING: written to tolerate several paste shapes because platforms
   change their markup often. Send a real paste that parses badly and the shape
   can be added — that is cheaper than guessing at a strict format. */

let proPaste='', proPlatform='instagram', proRows=[], proFilter='new';

/* TRADE exists to STRIP generic words out of company names, so it is deliberately
   narrow. Detecting whether a pasted name is a trade business needs a much wider
   vocabulary — gutters, screens, concrete, paving and so on are companies, not
   filler. This list is additive and safe to extend. */
const PRO_TRADE=new Set([...TRADE,
 'GUTTERS','GUTTER','SCREENS','SCREEN','SHUTTERS','SHUTTER','ENCLOSURES','ENCLOSURE',
 'CONCRETE','MASONRY','STUCCO','PAVING','ASPHALT','FENCE','FENCING','DECK','DECKING',
 'POOL','POOLS','SPA','LANDSCAPE','LANDSCAPING','IRRIGATION','PAINTING','PAINTERS',
 'DRYWALL','FLOORING','FLOORS','TILE','CABINETS','COUNTERTOPS','GRANITE','INSULATION',
 'FRAMING','CARPENTRY','WELDING','EXCAVATION','GRADING','DEMOLITION','SEPTIC','WELL',
 'GENERATOR','GENERATORS','LIGHTING','SECURITY','ALARM','GARAGE','AWNING','AWNINGS',
 'CANOPY','LANAI','PATIO','PORCH','SUNROOM','SUNROOMS','PERGOLA','RAILING','RAILINGS',
 'CHIMNEY','WATERPROOFING','SEALING','SEALCOATING','PRESSURE','CLEANING','RESTORATION',
 'REMEDIATION','MITIGATION','INSPECTION','INSPECTIONS','SURVEYING','ENGINEERING',
 'ARCHITECT','ARCHITECTS','DESIGN','BUILD','BUILDING','SUPPLY','SUPPLIES','DISTRIBUTION',
 'DISTRIBUTORS','WHOLESALE','MATERIALS','LUMBER','HARDWARE','EQUIPMENT','RENTAL',
 'RENTALS','TRUSS','TRUSSES','STEEL','ALUMINUM','VINYL','ROOFS','SOLARPOWER',
 'PHOTOVOLTAIC','ENERGY','CLIMATE','COMFORT','REFRIGERATION','DUCT','SHEETMETAL',
 'EXCAVATING','UTILITIES','PLUMBERS','ELECTRICIANS','MECHANICALS','TRADES','TRADE',
 'PERMITTING','PERMITS','EXPEDITING','CONSULTING','CONSULTANTS','MANAGEMENT',
 'PROPERTIES','REALTY','DEVELOPERS','RENOVATIONS','RENOVATION','REMODEL','REMODELERS',
 'HANDYMAN','MAINTENANCE','REPAIR','REPAIRS','INSTALL','INSTALLATION','INSTALLERS',
 'SIDINGS','WINDOWS','DOORS','ENTRY','IMPACT','HURRICANE','STORM']);

const PRO_NOISE=/^(follow|following|followers|message|remove|verified|suggested for you|follows you|see all|search|new|mutual|friend|add friend|connect|pending|·|•|-|—)$/i;

/* Real pastes carry metadata lines that belong to the entry ABOVE them, not to a
   company of their own — a location under a page, a job title under a person.
   Left in, they become phantom records and shift every pairing after them. */
const PRO_META=[
  /^[A-Z][A-Za-z.\- ]+,\s*(A[LKZR]|C[AOT]|D[EC]|FL|GA|HI|I[ADLN]|K[SY]|LA|M[ADEINOST]|N[CDEHJMVY]|O[HKR]|P[AR]|RI|S[CD]|T[NX]|UT|V[AT]|W[AIVY]|Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia|Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland|Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New\s\w+|North\s\w+|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode\sIsland|South\s\w+|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West\sVirginia|Wisconsin|Wyoming|Puerto\sRico)\s*$/,
  /\bat\s+[A-Z]/,                       /* "Attorney at Morgan & Morgan" */
  /^\d[\d.,]*[KMkm]?\s*(followers?|following|likes?|posts?|connections?)\b/i,
  /^(works? at|studied at|lives in|from|went to)\b/i,
];
const isMetaLine=s=>PRO_META.some(re=>re.test(s));

const PERSON_HINT=/^(mr|mrs|ms|dr)\.?\s/i;

/* Words that make a name a business even with no trade word — a supplier, agency
   or institution is still worth seeing. Deliberately broad: a false include costs
   one glance, a false drop loses a prospect silently. */
const BIZ_HINT=new Set(['AGENCY','MEDIA','GROUP','SOLUTIONS','SYSTEMS','COMPONENTS','LABS','LAB',
 'UNIVERSITY','COLLEGE','ACADEMY','INSTITUTE','FOUNDATION','ASSOCIATION','COUNCIL','CHAMBER',
 'DIRECT','CENTER','CENTRE','INSURANCE','REALTY','REAL','ESTATE','LAW','ATTORNEYS','ATTORNEY',
 'BREWING','CARS','AUTO','MOTORS','SALES','STAFFING','RECRUITING','CONSULTING','CONSULTANTS',
 'PARTNERS','ENTERPRISE','HOLDINGS','VENTURES','STUDIO','STUDIOS','WORKS','WORKSHOP','SHOP',
 'STORE','MARKET','TRADING','LOGISTICS','TRANSPORT','FLEET','RENTAL','RENTALS','LEASING',
 'FINANCIAL','CAPITAL','BANK','CREDIT','TITLE','ESCROW','MORTGAGE','ADVERTISING','MARKETING',
 'DIGITAL','TECH','TECHNOLOGIES','TECHNOLOGY','SOFTWARE','DESIGNS','GRAPHICS','PRINTING',
 'SCREENPRINTING','SIGNS','SIGNAGE','WRAPS','PROMOTIONS','EVENTS','CATERING','CLEANING',
 'JANITORIAL','SECURITY','GUARD','PROTECTION','STORAGE','MOVING','HAULING','RECYCLING',
 'DISPOSAL','ENVIRONMENTAL','TESTING','LABORATORY','COLLECTIONS','SERVICES','METAL','METALS',
 'STEEL','PLASTICS','PRODUCTS','MANUFACTURING','INDUSTRIAL','WHOLESALE','OUTLET','DEPOT',
 'PODCAST','SCHOOL','TRAINING','JOBS','CAREERS','TALENT','PTO','PTA','CITY','COUNTY','TOWN']);

/* A pasted line is a handle when it looks like one and carries no spaces. */
/* Instagram usernames are always lowercase and never contain spaces. A display
   name with any capital letter therefore is NOT a handle — which is what tells
   "Kayla" apart from "geotiquedesigns" when they sit on consecutive lines. */
const looksHandle=s=>/^@?[a-z0-9._-]{3,30}$/.test(s) && !/\s/.test(s);
/* A line that is a URL, or carries a tab / double space, is its own record and
   must never be swallowed as the previous line's display name. */
const isOwnRecord=s=>/https?:|\.com\//i.test(s) || /\t|\s{2,}/.test(s) || looksHandle(s);

function parsePaste(text, platform){
  /* Facebook and LinkedIn paste display names only — there are no handles, so
     handle detection there produces nothing but wrong pairings. */
  const hasHandles = platform==='instagram';
  const raw=String(text||'').replace(/\r/g,'').split('\n')
    .map(l=>l.replace(/\u00a0/g,' ').trim())
    .filter(l=>l && !PRO_NOISE.test(l) && !isMetaLine(l));

  const out=[]; const seen=new Set();
  const push=(handle,name)=>{
    handle=(handle||'').replace(/^@/,'').trim();
    name=(name||'').trim();
    const key=(handle||name).toLowerCase();
    if(!key||seen.has(key))return; seen.add(key);
    out.push({handle,name:name||handle});
  };

  for(let i=0;i<raw.length;i++){
    const line=raw[i];

    /* a pasted profile URL — the most reliable shape of all */
    const m=line.match(/(?:instagram|facebook|linkedin)\.com\/(?:company\/|in\/)?([A-Za-z0-9._-]+)/i);
    if(m){
      const nxt=raw[i+1];
      /* only claim the next line as the display name if it is not itself a record */
      if(nxt && !isOwnRecord(nxt) && nxt.length<60){
        push(m[1], nxt); i++;
      } else push(m[1], '');
      continue;
    }

    /* "handle  Display Name" on one line, tab or double-space separated */
    const two=line.split(/\t|\s{2,}/).map(x=>x.trim()).filter(Boolean);
    if(hasHandles && two.length>=2 && looksHandle(two[0])){ push(two[0], two.slice(1).join(' ')); continue; }
    if(hasHandles && two.length>=2 && looksHandle(two[two.length-1])){
      push(two[two.length-1], two.slice(0,-1).join(' ')); continue; }

    /* handle on its own line, display name on the next — the common IG shape */
    if(hasHandles && looksHandle(line)){
      const nxt=raw[i+1];
      /* Display names run long — a bio line can be 100 characters. The old 60
         limit split real pairs in two and orphaned the name. */
      if(nxt && !isOwnRecord(nxt) && nxt.length<=120){ push(line,nxt); i++; }
      else push(line,'');
      continue;
    }

    /* a plain display name with no handle — common on LinkedIn */
    if(line.length>2 && line.length<=140) push('', line);
  }
  return out;
}

/* Free classification. Reuses the same name rules as the rest of the tool. */
function classifyProspect(p, knownKeys){
  const text=(p.name+' '+p.handle).replace(/[._-]/g,' ');
  const toks=tokens(text);
  /* Handles run words together — "gafroofing", "tampabayhvac" — so token matching
     alone misses them. Fall back to a substring scan of the collapsed text. */
  const flat=text.toUpperCase().replace(/[^A-Z]/g,'');
  const hasTrade=toks.some(t=>PRO_TRADE.has(t)) ||
    ['ROOFING','ROOFER','PLUMBING','PLUMBER','ELECTRIC','HVAC','SOLAR','WINDOW','DOOR',
     'SIDING','GUTTER','CONCRETE','PAVING','FENCE','POOL','SUPPLY','BUILDER','CONTRACT',
     'MECHANICAL','HEATING','COOLING','GLASS','SCREEN','SHUTTER','CONSTRUCT','DRAIN',
     'SEPTIC','TEMPSERVICE','AIRCOND','REFRIGER','INSULAT','MASONRY','STUCCO','LANDSCAP',
     'IRRIGAT','PAINTING','DRYWALL','FLOORING','CABINET','COUNTERTOP','WELDING','EXCAVAT',
     'DEMOLITION','GENERATOR','LIGHTING','GARAGE','AWNING','LANAI','PATIO','SUNROOM',
     'PERGOLA','RAILING','CHIMNEY','WATERPROOF','SEALCOAT','PRESSUREWASH','RESTORATION',
     'REMEDIATION','TOOLS','TOOLCOR','CRANE','LIFT','SCAFFOLD','TRUSS','LUMBER','HARDWARE',
     'LEADS','ADS','MARKETING'].some(t=>flat.includes(t));
  const hasEntity=COMPANY_MARKER.test(text);
  const key=normKey(p.name)||normKey(p.handle);

  const hasBiz=toks.some(t=>BIZ_HINT.has(t));

  if(key && knownKeys.has(key)) return {kind:'known', why:'Already in your list'};
  if(!p.name && !p.handle)      return {kind:'junk',  why:'Nothing usable'};
  if(PERSON_HINT.test(p.name))  return {kind:'person',why:'Personal title'};
  if(hasTrade||hasEntity)       return {kind:'new',
    why:hasEntity&&hasTrade?'Trade and entity words':hasEntity?'Entity word':'Trade word'};
  if(hasBiz)                    return {kind:'new', why:'Business word'};

  /* Two capitalised words and nothing else reads as a person — but only when no
     business word was found above, so "Sunshine Gutters" and "Appliance Direct"
     never reach here. */
  /* Two or three capitalised words and nothing else. Unicode-aware so accented
     names are caught, and tolerant of a middle initial. Only reached when no
     trade, entity or business word was found above. */
  if(/^\p{Lu}[\p{Ll}'’-]+(\s+\p{Lu}\.?)?(\s+\p{Lu}[\p{Ll}'’-]+){1,2}$/u.test(p.name.trim()))
    return {kind:'person',why:'Reads as a personal name'};
  if(/^[a-z0-9._]+$/.test(p.name) && !p.handle)   return {kind:'junk', why:'No business signal'};

  /* Everything else is genuinely ambiguous. Show it rather than discard it — a
     wrongly dropped company is lost silently, a wrongly kept one costs a glance. */
  if(p.name && p.name.length>3) return {kind:'unsure', why:'No clear signal either way'};
  return {kind:'junk', why:'No business signal'};
}

function runProspect(){
  const known=new Set();
  rows.forEach(r=>{const k=normKey(r.name); if(k)known.add(k);});
  const parsed=parsePaste(proPaste, proPlatform);
  proRows=parsed.map(p=>({...p, ...classifyProspect(p,known)}));
  draw();
}

  const chips=['new','unsure','known','person','junk','all'].map(k=>

  const list=total?'<div class="dcard"><h3>Parsed names</h3>'+

let dirHandle=null, dirFiles=[], shelf=[], docMsg='';
const FS_OK = typeof window!=='undefined' && 'showDirectoryPicker' in window;
const fmtSize=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(0)+' KB':(b/1048576).toFixed(1)+' MB';
const fmtDate=t=>{const d=new Date(t);return isNaN(d)?'—':d.toISOString().slice(0,10)+' '+d.toTimeString().slice(0,5)};
const extOf=n=>(String(n).split('.').pop()||'').toLowerCase();

async function scanFolder(){
  dirFiles=[];
  for await (const [name,handle] of dirHandle.entries()){
    if(handle.kind!=='file')continue;
    const e=extOf(name); if(!['csv','xlsx','xls'].includes(e))continue;
    let size=0,mod=0;
    try{const f=await handle.getFile();size=f.size;mod=f.lastModified}catch(err){}
    dirFiles.push({name,handle,ext:e,size,mod});
  }
  dirFiles.sort((a,b)=>b.mod-a.mod);
}
async function connectFolder(){
  try{
    dirHandle=await window.showDirectoryPicker({mode:'readwrite'});
    await scanFolder();
    docMsg=dirFiles.length+' file(s) found in “'+dirHandle.name+'”.';
  }catch(err){ if(err.name!=='AbortError') docMsg='Could not open that folder: '+err.message; }
  draw();
}
let SHEETJS=null;
async function loadSheetJS(){
  if(SHEETJS)return SHEETJS;
  if(window.XLSX){SHEETJS=window.XLSX;return SHEETJS}
  await new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=res;s.onerror=()=>rej(new Error('Could not reach the spreadsheet reader. Save the file as CSV and import that instead.'));
    document.head.appendChild(s);
  });
  SHEETJS=window.XLSX;return SHEETJS;
}
async function loadFileObject(file,sheetName){
  const e=extOf(file.name);
  if(e==='csv'){ stageImport(await file.text(),file.name); return null; }
  const XLSX=await loadSheetJS();
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  if(wb.SheetNames.length>1 && !sheetName) return {pickSheets:wb.SheetNames};
  const sn=sheetName||wb.SheetNames[0];
  const ws=wb.Sheets[sn];
  if(!ws) throw new Error('Sheet “'+sn+'” not found.');
  stageImport(XLSX.utils.sheet_to_csv(ws),file.name+' · '+sn);
  return null;
}
async function openDoc(src,sheetName){
  try{
    const file = src.handle ? await src.handle.getFile() : src.file;
    const r=await loadFileObject(file,sheetName);
    if(r&&r.pickSheets){ src.sheets=r.pickSheets; docMsg='“'+file.name+'” has several sheets — pick one.'; draw(); return; }
    docMsg='';draw();
  }catch(err){ docMsg=err.message; draw(); }
}

  draw();
}

function daysIn(){const n=new Date();const eom=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();
  return {day:n.getDate(),eom,left:Math.max(1,eom-n.getDate()+1)}}
function withinDays(ds,n){if(!ds)return false;
  const t=new Date(ds+'T00:00:00'),now=new Date();
  return (now-t)/86400000<=n && (now-t)>=-1}

function dashHTML(){
  const D=daysIn();
  const researched=rows.filter(touchedRow).length;
  const expected=Math.round(TARGET.research*(D.day/D.eom));
  const perDayDone=researched/Math.max(1,D.day);
  const projected=Math.round(perDayDone*D.eom);
  const remain=Math.max(0,TARGET.research-researched);
  const need=Math.ceil(remain/D.left);
  const pctRes=pctOf(researched,TARGET.research), pctTime=Math.round(D.day/D.eom*100);
  const ahead=researched>=expected;

  /* ---- hero ---- */
  const hero='<div class="hero">'+
    '<div><div class="cap">Researched this month</div><div class="big">'+researched.toLocaleString()+
      '<s> / '+TARGET.research+'</s></div></div>'+
    '<div><div class="cap">Projected month end</div><div class="sm">'+projected.toLocaleString()+'</div>'+
      '<div class="note '+(projected>=TARGET.research?'ok':'bad')+'">'+
      (projected>=TARGET.research?'on course to clear target':(TARGET.research-projected)+' short at this rate')+'</div></div>'+
    '<div><div class="cap">Pace needed</div><div class="sm">'+need+'<span style="font-size:14px"> /day</span></div>'+
      '<div class="note">'+remain.toLocaleString()+' left · '+D.left+' days</div></div>'+
    '<div><div class="cap">Currently</div><div class="sm '+(ahead?'ok':'bad')+'">'+
      (ahead?'+':'')+(researched-expected)+'</div><div class="note">'+(ahead?'ahead of':'behind')+
      ' pace · on track = '+expected+'</div></div>'+
    '<div class="wide"><div class="htrack"><i style="width:'+pctRes+'%"></i><u style="left:'+pctTime+'%"></u></div>'+
      '<div class="hlegend"><span>'+pctRes+'% of target</span><span>white marker = '+pctTime+'% of the month gone</span></div></div>'+
  '</div>';

  /* ---- funnel ---- */
  const loaded=rows.length;
  const anyFound=rows.filter(r=>found(r)>0).length;
  const followed=rows.filter(r=>followedN(r)>0).length;
  const backs=rows.filter(r=>r.bfb===true||r.big===true||r.bli===true).length;
  const engaged=rows.filter(r=>(r.eng||0)>0).length;
  const F=[['Loaded',loaded],['Researched',researched],['At least one profile',anyFound],
           ['Followed',followed],['Followed us back',backs],['Engaged with',engaged]];
  const fmax=Math.max(1,loaded);
  const funnel='<div class="dcard"><h3>Funnel</h3>'+F.map(([l,n],k)=>{
    const prev=k?F[k-1][1]:0;
    const conv=k&&prev?Math.round(n/prev*100)+'%':'';
    return '<div class="frow"><span class="fl">'+l+'</span>'+
      '<span class="fb2"><i style="width:'+pctOf(n,fmax)+'%"></i></span>'+
      '<span class="fn">'+n.toLocaleString()+'</span><span class="fp">'+conv+'</span></div>';
  }).join('')+'<div class="dnote">Right-hand figure is conversion from the step above.</div></div>';

  /* ---- platforms ---- */
  const plat=['fb','ig','li'].map(k=>{
    const f=rows.filter(r=>r[k]===true).length;
    const no=rows.filter(r=>r[k]===false).length;
    const dk='d'+k, done=rows.filter(r=>r[dk]).length;
    const bk='b'+k, bb=rows.filter(r=>r[bk]===true).length;
    const name={fb:'Facebook',ig:'Instagram',li:'LinkedIn'}[k];
    return '<tr><td><b>'+name+'</b><div class="minibar"><i style="width:'+pctOf(f,TARGET[k])+'%"></i></div></td>'+
      '<td class="c">'+f+' <span class="pill">/ '+TARGET[k]+'</span></td><td class="c">'+no+'</td>'+
      '<td class="c">'+done+'</td><td class="c">'+bb+'</td>'+
      '<td class="c">'+(done?Math.round(bb/done*100)+'%':'—')+'</td></tr>';
  }).join('');
  const platCard='<div class="dcard"><h3>By platform</h3><table class="dtable"><thead><tr>'+
    '<th>Platform</th><th class="c">Found</th><th class="c">Absent</th><th class="c">Followed</th>'+
    '<th class="c">Back</th><th class="c">Rate</th></tr></thead><tbody>'+plat+'</tbody></table>'+
    '<div class="dnote">Absent means checked and confirmed not there — that is what makes hit rates real.</div></div>';

  /* ---- verticals ---- */
  const vt=Object.keys(PLAN).map(v=>{
    const inv=rows.filter(r=>r.vert===v), done=inv.filter(touchedRow).length;
    const p=pctOf(done,PLAN[v].res);
    return '<tr><td><b>'+v.replace('Windows-Doors-Siding','Windows/Doors').replace('Mechanical-HVAC','HVAC')+'</b>'+
      '<div class="minibar"><i style="width:'+p+'%"></i></div></td>'+
      '<td class="c">'+inv.length.toLocaleString()+'</td><td class="c">'+done+' / '+PLAN[v].res+'</td>'+
      '<td class="c">'+p+'%</td>'+
      '<td class="c">'+inv.filter(r=>r.fb===true).length+'</td>'+
      '<td class="c">'+inv.filter(r=>r.ig===true).length+'</td>'+
      '<td class="c">'+inv.filter(r=>r.li===true).length+'</td></tr>';

  const vertCard='<div class="dcard"><h3>By vertical</h3><table class="dtable"><thead><tr>'+
    '<th>Vertical</th><th class="c">Loaded</th><th class="c">Researched</th><th class="c">Quota</th>'+
    '<th class="c">FB</th><th class="c">IG</th><th class="c">LI</th></tr></thead><tbody>'+vt+'</tbody></table></div>';

  /* ---- geography ---- */
  const byState={};rows.forEach(r=>{const k=r.state||'—';
    byState[k]=byState[k]||{n:0,d:0};byState[k].n++;if(touchedRow(r))byState[k].d++});
  const gmax=Math.max(1,...Object.values(byState).map(o=>o.n));

      '<span class="fn">'+o.d+' / '+o.n+'</span><span class="fp">'+pctOf(o.d,o.n)+'%</span></div>').join('')+
    '</div>';

  /* ---- verdict mix ---- */
  const vm={};rows.forEach(r=>{vm[r.chk.verdict]=(vm[r.chk.verdict]||0)+1});
  const vmax=Math.max(1,...Object.values(vm));
  const emp=vm.employer||0;

    Object.entries(vm).sort((a,b)=>b[1]-a[1]).map(([k,n])=>
      '<div class="frow"><span class="fl">'+VERD[k]+'</span>'+
      '<span class="fb2"><i style="width:'+pctOf(n,vmax)+'%"></i></span>'+
      '<span class="fn">'+n.toLocaleString()+'</span><span class="fp">'+pctOf(n,rows.length)+'%</span></div>').join('')+
    (emp?'<div class="dnote"><b>'+emp+'</b> records sit on a shared employer domain. Those searches run on the '+
      'employer, not the person on the permit.</div>':'')+'</div>';

  /* ---- activity + platform safety ---- */
  const act=['fb','ig','li'].map(k=>{
    const dk='d'+k;
    const t=rows.filter(r=>r[dk]===today()).length;
    const w=rows.filter(r=>withinDays(r[dk],7)).length;
    return {k,name:{fb:'Facebook',ig:'Instagram',li:'LinkedIn'}[k],t,w};
  });
  const igToday=act.find(a=>a.k==='ig').t;
  const actCard='<div class="dcard"><h3>Recent activity</h3><table class="dtable"><thead><tr>'+
    '<th>Platform</th><th class="c">Followed today</th><th class="c">Last 7 days</th></tr></thead><tbody>'+
    act.map(a=>'<tr><td><b>'+a.name+'</b></td><td class="c">'+a.t+'</td><td class="c">'+a.w+'</td></tr>').join('')+
    '</tbody></table>'+
    (igToday>=100?'<div class="alert"><b>Slow down on Instagram.</b> '+igToday+' follows stamped today. '+
      'The safe ceiling is around 100–150 a day and roughly 20 an hour — bursts are what trigger action blocks, '+
      'not daily totals.</div>'
     :igToday>=60?'<div class="alert">'+igToday+' Instagram follows today. Spread the rest across the day rather than batching.</div>'
     :'<div class="good">Pacing is comfortably inside every platform limit.</div>')+'</div>';

  /* ---- next up ---- */
  const next=rows.filter(r=>r.stage==='research'&&!touchedRow(r))
    .sort((a,b)=>(b.score||b.permits)-(a.score||a.permits)).slice(0,10);
  const nextCard='<div class="dcard"><h3>Highest value still untouched</h3>'+
