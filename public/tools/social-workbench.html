        '<td class="c"><span class="pill">'+esc(r.vert)+'</span></td>'+
        '<td class="c">'+(Number(r.permits)||0).toLocaleString()+'</td>'+
        '<td class="c">'+esc(r.state)+'</td></tr>').join('')+'</tbody></table>'
      :'<div class="dnote">Nothing left unresearched.</div>')+'</div>';

  return '<div class="dash">'+hero+
    '<div class="dgrid">'+funnel+platCard+'</div>'+
    vertCard+
    '<div class="dgrid">'+geo+verd+actCard+'</div>'+
    nextCard+'</div>';
}

function measured(v){
  const inv=rows.filter(r=>r.vert===v), checked=inv.filter(touchedRow).length;
  const f=k=>inv.filter(r=>r[k]===true).length;
  return {checked, fb:f('fb'), ig:f('ig'), li:f('li'),
    rfb:checked?f('fb')/checked:0, rig:checked?f('ig')/checked:0, rli:checked?f('li')/checked:0};
}
const MINSAMPLE=8, CONFIDENT=30;

function ratesHTML(){
  /* ---------- editable monthly plan ---------- */
  const pRow=v=>{
    const p=PLAN[v], m=measured(v);
    const proj=k=>Math.round(p.res*p[k]);
    const rc=k=>'<td class="c"><input class="pin" type="number" min="0" max="100" step="1" '+
      'data-plan="'+esc(v)+'" data-f="'+k+'" value="'+Math.round(p[k]*100)+'">%</td>';
    return '<tr><td><b>'+esc(v)+'</b></td>'+
      '<td class="c"><input class="pin wide" type="number" min="0" step="5" data-plan="'+esc(v)+'" data-f="res" value="'+p.res+'"></td>'+
      rc('fb')+rc('ig')+rc('li')+
      '<td class="c">'+proj('fb')+'</td><td class="c">'+proj('ig')+'</td><td class="c">'+proj('li')+'</td>'+
      '<td class="c">'+(proj('fb')+proj('ig')+proj('li'))+'</td></tr>';
  };
  const planCard='<div class="dcard"><h3>Monthly plan</h3>'+
    '<p class="intro">Companies researched per month per vertical, and the share expected to have a profile on each platform. '+
    'Everything downstream reads from here — the KPI targets, the dashboard pacing, the projections below.</p>'+
    '<table class="rtable"><thead><tr><th>Vertical</th><th class="c">Research /mo</th>'+
    '<th class="c">FB rate</th><th class="c">IG rate</th><th class="c">LI rate</th>'+
    '<th class="c">→ FB</th><th class="c">→ IG</th><th class="c">→ LI</th><th class="c">Follows</th></tr></thead><tbody>'+
    Object.keys(PLAN).map(pRow).join('')+'</tbody><tfoot><tr><td>Totals</td>'+
    '<td class="c">'+TARGET.research+'</td><td class="c" colspan="3"></td>'+
    '<td class="c">'+TARGET.fb+'</td><td class="c">'+TARGET.ig+'</td><td class="c">'+TARGET.li+'</td>'+
    '<td class="c">'+(TARGET.fb+TARGET.ig+TARGET.li)+'</td></tr></tfoot></table>'+
    '<div class="dnote">Edits apply immediately across the tool. In the dashboard build this becomes a saved settings '+
    'table rather than a per-session value.</div></div>';

  /* ---------- measured vs planned ---------- */
  const cell=(v,k)=>{
    const p=PLAN[v], m=measured(v);
    if(m.checked<MINSAMPLE) return '<td class="c thin">'+m[k]+'/'+m.checked+'<br>need '+MINSAMPLE+'+</td>';
    const act=m['r'+k], d=Math.round((act-p[k])*100);
    const cls=d>=5?'up':d<=-5?'down':'flat';
    return '<td class="c"><b>'+Math.round(act*100)+'%</b><br><span class="'+cls+'">'+(d>0?'+':'')+d+' pts</span>'+
      '<br><span class="thin">plan '+Math.round(p[k]*100)+'%</span></td>';
  };
  let tot={c:0,fb:0,ig:0,li:0}, anyReady=false;
  const mBody=Object.keys(PLAN).map(v=>{
    const m=measured(v); tot.c+=m.checked;tot.fb+=m.fb;tot.ig+=m.ig;tot.li+=m.li;
    const ready=m.checked>=MINSAMPLE; if(ready)anyReady=true;
    const conf=m.checked>=CONFIDENT?'<span class="tagok">solid</span>'
      :ready?'<span class="tagsoft">thin</span>':'';
    return '<tr><td><b>'+esc(v)+'</b> '+conf+'<br><span class="thin">'+
      rows.filter(r=>r.vert===v).length.toLocaleString()+' loaded · plan '+PLAN[v].res+'/mo</span></td>'+
      '<td class="c">'+m.checked+'</td>'+cell(v,'fb')+cell(v,'ig')+cell(v,'li')+
      '<td class="c">'+(ready?'<button class="docbtn pri" data-apply="'+esc(v)+'">Apply</button>':'<span class="thin">—</span>')+'</td></tr>';
  }).join('');
  const tRow=tot.c>=MINSAMPLE
    ? '<tr><td>All verticals</td><td class="c">'+tot.c+'</td>'+
      ['fb','ig','li'].map(k=>'<td class="c">'+Math.round(tot[k]/tot.c*100)+'%</td>').join('')+
      '<td class="c">'+(anyReady?'<button class="docbtn pri" data-applyall="1">Apply all</button>':'')+'</td></tr>'
    : '<tr><td>All verticals</td><td class="c">'+tot.c+'</td><td class="c thin" colspan="4">check '+MINSAMPLE+'+ to see rates</td></tr>';

  const measCard='<div class="dcard"><h3>Measured against plan</h3>'+
    '<p class="intro">Real presence rates from what has actually been checked. <b>Apply</b> writes a vertical\u2019s measured '+
    'rates straight into the plan above — no copying into a spreadsheet. Rates hold back until '+MINSAMPLE+
    ' records are checked, and are only worth trusting past '+CONFIDENT+'.</p>'+
    '<table class="rtable"><thead><tr><th>Vertical</th><th class="c">Checked</th><th class="c">Facebook</th>'+
    '<th class="c">Instagram</th><th class="c">LinkedIn</th><th class="c">Update plan</th></tr></thead>'+
    '<tbody>'+mBody+'</tbody><tfoot>'+tRow+'</tfoot></table>'+
    '<div class="callout"><b>A red mark is data.</b> A rate is found ÷ checked, so a platform you never looked at is '+
    'correctly ignored — but marking it red when you checked and it was absent is what makes the number honest. '+
    'Blank rows count neither way.</div></div>';

  return '<div class="rates">'+planCard+measCard+'</div>';
}
function bindRates(){
  $$('[data-plan]').forEach(el=>el.onchange=()=>{
    const v=el.dataset.plan,f=el.dataset.f,n=Number(el.value)||0;
    PLAN[v][f]= f==='res' ? Math.max(0,Math.round(n)) : Math.min(1,Math.max(0,n/100));
    recalcTargets();touch();draw();});
  $$('[data-apply]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.apply,m=measured(v);
    PLAN[v].fb=m.rfb;PLAN[v].ig=m.rig;PLAN[v].li=m.rli;
    recalcTargets();touch();draw();});
  const all=$('[data-applyall]');
  if(all)all.onclick=()=>{
    Object.keys(PLAN).forEach(v=>{const m=measured(v);
      if(m.checked>=MINSAMPLE){PLAN[v].fb=m.rfb;PLAN[v].ig=m.rig;PLAN[v].li=m.rli}});
    recalcTargets();touch();draw();};
}
